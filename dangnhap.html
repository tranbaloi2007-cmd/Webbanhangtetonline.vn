<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="dangnhap.css">
</head>
<body>
    <div class="login-container">
        <h2>Đăng Nhập</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Tên đăng nhập hoặc Email</label>
                <input type="text" id="username" placeholder="Nhập tài khoản..." required>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
            </div>
            <div class="options">
                <label><input type="checkbox"> Ghi nhớ tôi</label>
                <a href="#">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="btn-login">Đăng nhập</button>
            <p class="register-link">Chưa có tài khoản? <a href="#">Đăng ký ngay</a></p>
        </form>
    </div>

    <script>
        // Xử lý kiểm tra đăng nhập mẫu
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === '123456') {
                alert('Đăng nhập thành công!');
                window.location.href = 'index.html'; // Chuyển về trang chủ của bạn
            } else {
                alert('Sai tài khoản hoặc mật khẩu! (Thử: admin / 123456)');
            }
        });
    </script>
</body>
</html>
